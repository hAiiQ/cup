services:
  - type: web
    name: path-of-gambit
    autoDeploy: true
    env: node
    buildCommand: |
      echo "🚀 Starting build process..."
      npm install
      echo "📦 Dependencies installed"
      npx prisma generate
      echo "🔧 Prisma client generated"
      echo "🗄️ Setting up database..."
      npm run render-postbuild
      echo "🎯 Production setup completed"
      npm run build
      echo "✅ Build process completed"
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: path-of-gambit-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production

databases:
  - name: path-of-gambit-db
    databaseName: tournament_db
    user: tournament_user
